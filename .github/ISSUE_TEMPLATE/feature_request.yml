name: feature request
description: Suggest a language feature, a check or a tooling improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation, not the solution.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed syntax / behaviour
      render: annota
      placeholder: |
        [[require: xs != null]]
        first(xs) = xs[0]
    validations:
      required: false
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - language (lexer / parser / compiler / VM)
        - standard library
        - static analysis (new check or precision)
        - IDE / LSP / CLI
        - documentation
        - build and packaging
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
